<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060609">
<title>DHH — 9 HIP HOP GANG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #050508;
  --red: #ff1738;
  --red-glow: rgba(255, 23, 56, 0.55);
  --glass-surface: rgba(255, 255, 255, 0.05);
  --glass-surface-hover: rgba(255, 255, 255, 0.09);
  --glass-border: rgba(255, 255, 255, 0.16);
  --glass-specular: inset 0 1.5px 1px rgba(255, 255, 255, 0.35), inset 0 -1px 1px rgba(0, 0, 0, 0.5);
  --glass-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
  --blur: 32px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

body {
  background: var(--bg);
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

.liquid-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}

.liquid-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(85px);
  opacity: 0.65;
  animation: liquidFloat 16s infinite alternate ease-in-out;
}
.orb-1 { width: 420px; height: 420px; top: -80px; right: -60px; background: radial-gradient(circle, #ff1738bb 0%, transparent 75%); }
.orb-2 { width: 440px; height: 440px; top: 35%; left: -120px; background: radial-gradient(circle, #831843cc 0%, transparent 75%); animation-duration: 20s; }
.orb-3 { width: 380px; height: 380px; bottom: 80px; right: -50px; background: radial-gradient(circle, #991b1bee 0%, transparent 75%); animation-duration: 18s; }

@keyframes liquidFloat {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(45px, 60px) scale(1.15); }
  100% { transform: translate(-35px, -40px) scale(0.92); }
}

.liquid-glass {
  background: var(--glass-surface);
  backdrop-filter: blur(var(--blur)) saturate(190%);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(190%);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-specular), var(--glass-shadow);
}

.app {
  position: relative;
  z-index: 2;
  max-width: 480px;
  min-height: 100dvh;
  margin: auto;
  padding: 24px 18px 230px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}

.logo {
  font-family: 'Orbitron', sans-serif;
  font-size: 32px;
  font-weight: 900;
  letter-spacing: -1.5px;
}

.logo span {
  color: var(--red);
  text-shadow: 0 0 16px var(--red-glow);
}

.glass-pill {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1.5px;
  padding: 8px 14px;
  border-radius: 30px;
  display: flex;
  align-items: center;
  gap: 7px;
  transition: transform .25s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.glass-pill:hover {
  transform: translateY(-3px) scale(1.06);
}

.pulse-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--red);
  box-shadow: 0 0 10px var(--red);
}

.hero-glass {
  position: relative;
  min-height: 190px;
  border-radius: 22px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 22px;
  margin-bottom: 24px;
  cursor: pointer;
  transition: transform .35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow .35s ease;
}

.hero-glass:hover {
  transform: translateY(-8px) scale(1.02);
  box-shadow: 0 26px 60px rgba(0,0,0,0.85), 0 0 30px rgba(255, 23, 56, 0.35);
}

.hero-glass:active { transform: scale(0.98); }

.hero-watermark {
  position: absolute;
  right: -10px;
  top: 10px;
  font-family: 'Orbitron', sans-serif;
  font-size: 82px;
  font-weight: 900;
  color: rgba(255, 255, 255, 0.04);
}

.hero-label {
  color: var(--red);
  font-size: 10px;
  letter-spacing: 2.5px;
  font-weight: 900;
  margin-bottom: 6px;
}

.hero-glass h3 { font-family: 'Orbitron', sans-serif; font-size: 26px; font-weight: 900; line-height: 1.15; }
.hero-glass p { color: #9a9ab2; font-size: 12px; margin-top: 6px; }

.search-box {
  height: 52px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 16px;
  border-radius: 16px;
  margin-bottom: 24px;
  transition: transform .25s cubic-bezier(0.34, 1.56, 0.64, 1), border-color .3s;
}

.search-box:hover {
  transform: translateY(-3px);
}

.search-box:focus-within {
  transform: translateY(-4px) scale(1.01);
  border-color: rgba(255, 23, 56, 0.6);
  box-shadow: 0 0 25px rgba(255, 23, 56, 0.3);
}

.search-box input {
  width: 100%;
  color: #fff;
  background: transparent;
  border: 0;
  outline: none;
  font-size: 13.5px;
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  padding: 0 4px;
}

.section-header h2 { font-size: 16px; font-weight: 700; }

.track-counter {
  color: var(--red);
  font-size: 11px;
  letter-spacing: 2px;
  font-weight: 800;
  background: rgba(255, 23, 56, 0.12);
  padding: 5px 12px;
  border-radius: 12px;
  border: 1px solid rgba(255, 23, 56, 0.3);
}

.track-list { display: flex; flex-direction: column; gap: 11px; }

.track-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 11px 15px;
  border-radius: 18px;
  cursor: pointer;
  transition: transform .3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow .3s ease, border-color .3s ease, background .3s ease;
}

.track-card:hover {
  transform: translateY(-7px) scale(1.025);
  background: var(--glass-surface-hover);
  border-color: rgba(255, 23, 56, 0.5);
  box-shadow: 0 18px 40px rgba(0,0,0,0.7), 0 0 25px rgba(255, 23, 56, 0.25);
}

.track-card:active { transform: scale(0.98); }

.track-card.is-active {
  border-color: rgba(255, 23, 56, 0.7);
  background: rgba(255, 23, 56, 0.12);
  box-shadow: 0 10px 30px rgba(255, 23, 56, 0.25);
}

.track-art {
  width: 50px;
  height: 50px;
  border-radius: 14px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  font-size: 24px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  transition: transform .3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.track-card:hover .track-art {
  transform: scale(1.12) rotate(-3deg);
}

.track-details { flex: 1; min-width: 0; }
.track-title { font-size: 14px; font-weight: 700; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track-card.is-active .track-title { color: var(--red); }
.track-artist { font-size: 12px; color: #9a9ab2; }

.play-circle {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.15);
  background: rgba(255, 255, 255, 0.06);
  display: grid;
  place-items: center;
  font-size: 13px;
  transition: all .25s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.track-card:hover .play-circle {
  background: var(--red);
  border-color: var(--red);
  transform: scale(1.18);
  box-shadow: 0 0 16px var(--red-glow);
}

.eq-bars { display: none; align-items: flex-end; gap: 2.5px; height: 14px; margin-right: 6px; }
.track-card.is-active.playing .eq-bars { display: flex; }
.eq-bars span {
  width: 2.5px; background: var(--red); border-radius: 2px;
  animation: eqBounce 0.8s infinite ease-in-out alternate;
}
.eq-bars span:nth-child(1) { height: 40%; animation-delay: 0.1s; }
.eq-bars span:nth-child(2) { height: 100%; animation-delay: 0.3s; }
.eq-bars span:nth-child(3) { height: 65%; animation-delay: 0.2s; }
@keyframes eqBounce { 0% { height: 20%; } 100% { height: 100%; } }

.player-glass-dock {
  position: fixed;
  z-index: 100;
  left: 50%;
  bottom: calc(84px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  width: min(440px, calc(100% - 22px));
  border-radius: 26px;
  padding: 16px 18px 14px;
  transition: transform .3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow .3s ease;
}

.player-glass-dock:hover {
  box-shadow: 0 28px 70px rgba(0,0,0,0.8), 0 0 35px rgba(255, 23, 56, 0.2);
}

.player-main { display: flex; align-items: center; gap: 12px; }
.dock-art {
  width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center;
  font-size: 22px; border: 1px solid rgba(255, 255, 255, 0.2);
  transition: transform .3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.player-glass-dock:hover .dock-art { transform: scale(1.08); }
.dock-info { flex: 1; min-width: 0; }
.dock-title { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dock-artist { font-size: 11px; color: #9a9ab2; margin-top: 2px; }

.dock-actions { display: flex; align-items: center; gap: 5px; }
.glass-btn {
  background: none; border: none; color: #fff; padding: 6px; border-radius: 50%;
  display: grid; place-items: center; cursor: pointer;
  transition: transform .2s cubic-bezier(0.34, 1.56, 0.64, 1), color .2s;
}
.glass-btn svg { width: 19px; height: 19px; fill: currentColor; }
.glass-btn:hover { transform: translateY(-3px) scale(1.2); color: var(--red); }
.glass-btn:active { transform: scale(0.9); }
.glass-btn.active { color: var(--red); filter: drop-shadow(0 0 8px var(--red-glow)); }

#playPauseBtn {
  width: 44px; height: 44px; background: #fff; color: #000; border-radius: 50%;
  box-shadow: 0 4px 18px rgba(255, 255, 255, 0.35); margin: 0 2px;
}
#playPauseBtn:hover {
  background: var(--red); color: #fff; transform: translateY(-4px) scale(1.15);
  box-shadow: 0 8px 24px var(--red-glow);
}

.timeline-deck { margin-top: 12px; }
.timeline-slot { height: 14px; display: flex; align-items: center; cursor: pointer; position: relative; touch-action: none; }
.timeline-bar { width: 100%; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.12); position: relative; overflow: hidden; transition: height .2s; }
.timeline-slot:hover .timeline-bar { height: 6px; }
.timeline-fill { position: absolute; top: 0; left: 0; height: 100%; width: 0%; background: linear-gradient(90deg, #ff1738, #ff5772); box-shadow: 0 0 10px var(--red); }
.timeline-scrubber {
  position: absolute; top: 50%; left: 0%; transform: translate(-50%, -50%);
  width: 10px; height: 10px; border-radius: 50%; background: #fff; opacity: 0;
  transition: opacity .15s, transform .2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.timeline-slot:hover .timeline-scrubber { opacity: 1; transform: translate(-50%, -50%) scale(1.4); }
.time-row { display: flex; justify-content: space-between; font-size: 10px; color: #9a9ab2; margin-top: 2px; }

.secondary-deck {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(255, 255, 255, 0.07);
}
.volume-box { display: flex; align-items: center; gap: 7px; }
.volume-slider {
  -webkit-appearance: none; appearance: none; width: 75px; height: 3.5px;
  background: rgba(255, 255, 255, 0.18); border-radius: 4px; outline: none; cursor: pointer;
}
.volume-slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 11px; height: 11px;
  border-radius: 50%; background: #fff; cursor: pointer; transition: transform .15s;
}
.volume-slider::-webkit-slider-thumb:hover { transform: scale(1.35); background: var(--red); }

.limelight-nav-container {
  position: fixed;
  z-index: 120;
  left: 50%;
  bottom: env(safe-area-inset-bottom, 12px);
  transform: translateX(-50%);
  width: min(440px, calc(100% - 22px));
  height: 64px;
  border-radius: 24px;
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding: 0 10px;
}

.limelight-tab {
  position: relative;
  z-index: 20;
  flex: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  background: none;
  border: none;
  color: #fff;
  cursor: pointer;
  padding: 8px 0;
  transition: transform .25s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.limelight-tab:hover {
  transform: translateY(-6px) scale(1.15);
}
.limelight-tab:active {
  transform: scale(0.92);
}

.limelight-tab svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
  opacity: 0.35;
  transition: opacity .2s, transform .2s, filter .2s;
}
.limelight-tab.active svg {
  opacity: 1;
  fill: var(--red);
  filter: drop-shadow(0 0 12px var(--red-glow));
}
.limelight-tab span {
  font-size: 10px;
  font-weight: 700;
  opacity: 0.4;
  transition: opacity .2s;
}
.limelight-tab.active span {
  opacity: 1;
  color: #fff;
}

.limelight-beam {
  position: absolute;
  top: 0;
  height: 4px;
  width: 44px;
  border-radius: 9999px;
  background: var(--red);
  box-shadow: 0 0 16px var(--red), 0 0 30px var(--red);
  transition: left 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  pointer-events: none;
  z-index: 10;
}
.limelight-beam::after {
  content: "";
  position: absolute;
  top: 4px;
  left: -40%;
  width: 180%;
  height: 52px;
  clip-path: polygon(10% 100%, 35% 0, 65% 0, 90% 100%);
  background: linear-gradient(180deg, rgba(255, 23, 56, 0.42) 0%, transparent 100%);
  pointer-events: none;
}
</style>
</head>
<body>

<div class="liquid-canvas" aria-hidden="true">
  <div class="liquid-orb orb-1" id="orb1"></div>
  <div class="liquid-orb orb-2" id="orb2"></div>
  <div class="liquid-orb orb-3" id="orb3"></div>
</div>

<main class="app">
  <header>
    <div class="logo">DHH<span>.</span></div>
    <div class="glass-pill liquid-glass">
      <span class="pulse-dot"></span>
      <span>9 HIP HOP GANG</span>
    </div>
  </header>

  <section class="hero-glass liquid-glass" id="heroSpotlight">
    <div class="hero-watermark">DHH</div>
    <div class="hero-label">DHH EXCLUSIVE</div>
    <h3>THIS IS<br>HIP HOP.</h3>
    <p>Authentic verses. Liquid beats. Pure underground grit.</p>
  </section>

  <label class="search-box liquid-glass">
    <span style="color:var(--red); font-size:20px;">⌕</span>
    <input id="searchInput" type="search" placeholder="Search track or artist..." aria-label="Search">
  </label>

  <section>
    <div class="section-header">
      <h2>Underground Catalog</h2>
      <span class="track-counter" id="trackCount">10 TRACKS</span>

    <div class="track-list" id="trackList"></div>
  </section>
</main>

<section class="player-glass-dock liquid-glass">
  <div class="player-main">
    <div class="dock-art" id="dockArt">♫</div>
    <div class="dock-info">
      <div class="dock-title" id="nowTitle">Select a track</div>
      <div class="dock-artist" id="nowArtist">9 Hip Hop Gang</div>
    </div>
    
    <div class="dock-actions">
      <button class="glass-btn" id="likeBtn" aria-label="Favorite">
        <svg id="likeIcon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </button>
      <button class="glass-btn" id="prevBtn" aria-label="Previous">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="glass-btn" id="playPauseBtn" aria-label="Play/Pause">
        <svg id="playPauseIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="glass-btn" id="nextBtn" aria-label="Next">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>
  </div>

  <div class="timeline-deck">
    <div class="timeline-slot" id="timelineSlot" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="timeline-bar">
        <div class="timeline-fill" id="timelineFill"></div>
      </div>
      <div class="timeline-scrubber" id="timelineScrubber"></div>
    </div>
    <div class="time-row">
      <span id="currentTime">0:00</span>
      <span id="totalDuration">0:00</span>

  </div>

  <div class="secondary-deck">
    <div style="display:flex; gap:10px; align-items:center;">
      <button class="glass-btn" id="shuffleBtn" title="Shuffle">
        <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>
      <button class="glass-btn" id="loopBtn" title="Repeat (Off / All / One)">
        <svg id="loopIcon" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
    </div>
    <div class="volume-box">
      <button class="glass-btn" id="muteBtn" aria-label="Mute">
        <svg id="volumeIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      </button>
      <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.85">
    </div>
  </div>
</section>

<nav class="limelight-nav-container liquid-glass" id="limelightNav">
  <div class="limelight-beam" id="limelightBeam"></div>

  <button class="limelight-tab active" data-page="home" data-index="0">
    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    <span>Home</span>
  </button>
  <button class="limelight-tab" data-page="search" data-index="1">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <span>Search</span>
  </button>
  <button class="limelight-tab" data-page="liked" data-index="2">
    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    <span>Liked</span>

</nav>

<script>
const songs = [

  { id: 6,  title: "Madira",           artist: "Seedhe Maut (TBSM)",     emoji: "🌙", color: "#2e0817", url: "Madira.mp3" },
  { id: 7,  title: "Agency",           artist: "Talha Yunus & TA",       emoji: "🕶️", color: "#3f0714", url: "Agency.mp3" },
  { id: 8,  title: "Wishh",            artist: "Talha Yunus",            emoji: "✨", color: "#4a041c", url: "Wishh.mp3" },
  { id: 9,  title: "Nanchaku",         artist: "Seedhe Maut & MC Stan",  emoji: "⚔️", color: "#33081a", url: "Nanchaku.mp3" },
  { id: 10, title: "Afsanay",          artist: "Young Stunners",         emoji: "🎧", color: "#44051a", url: "Afsanay.mp3" }
];

const audio = document.getElementById("audio");
const trackList = document.getElementById("trackList");
const searchInput = document.getElementById("searchInput");
const trackCount = document.getElementById("trackCount");
const playPauseBtn = document.getElementById("playPauseBtn");
const playPauseIcon = document.getElementById("playPauseIcon");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const shuffleBtn = document.getElementById("shuffleBtn");
const loopBtn = document.getElementById("loopBtn");
const loopIcon = document.getElementById("loopIcon");
const likeBtn = document.getElementById("likeBtn");
const muteBtn = document.getElementById("muteBtn");
const volumeSlider = document.getElementById("volumeSlider");
const volumeIcon = document.getElementById("volumeIcon");
const timelineSlot = document.getElementById("timelineSlot");
const timelineFill = document.getElementById("timelineFill");
const timelineScrubber = document.getElementById("timelineScrubber");
const currentTimeEl = document.getElementById("currentTime");
const totalDurationEl = document.getElementById("totalDuration");
const limelightBeam = document.getElementById("limelightBeam");
const limelightTabs = document.querySelectorAll(".limelight-tab");

let currentIndex = -1;
let isShuffle = false;
let loopMode = 0;
function loadLiked() {
  try {
    const saved = JSON.parse(localStorage.getItem("dhh-liked") || "[]");
    return Array.isArray(saved) ? saved.filter(id => songs.some(song => song.id === id)) : [];
  } catch (_) { return []; }
}
let liked = loadLiked();
let currentPage = "home";
let isDragging = false;
let previousVol = 0.85;

function setPlaybackMessage(message) {
  const artist = document.getElementById("nowArtist");
  artist.textContent = message || (currentIndex >= 0 ? songs[currentIndex].artist : "9 Hip Hop Gang");
}

function formatTime(val) {
  if (!Number.isFinite(val)) return "0:00";
  const m = Math.floor(val / 60);
  const s = Math.floor(val % 60).toString().padStart(2, "0");
  return `${m}:${s}`;
}

function updateLimelightPosition(tabEl) {
  if (!tabEl || !limelightBeam) return;
  const newLeft = tabEl.offsetLeft + (tabEl.offsetWidth / 2) - (limelightBeam.offsetWidth / 2);
  limelightBeam.style.left = `${newLeft}px`;
}

function renderTracks() {
  const query = searchInput.value.toLowerCase().trim();
  const filtered = songs.filter(song => {
    const matchesSearch = `${song.title} ${song.artist}`.toLowerCase().includes(query);
    const matchesLiked = currentPage !== "liked" || liked.includes(song.id);
    return matchesSearch && matchesLiked;
  });

  trackCount.textContent = `${String(filtered.length).padStart(2, "0")} TRACKS`;

  if (!filtered.length) {
    trackList.innerHTML = '<div style="padding:35px 0; text-align:center; color:#9a9ab2;" class="liquid-glass">No tracks found.</div>';
    return;
  }

  trackList.innerHTML = filtered.map(song => {
    const isThisActive = currentIndex >= 0 && songs[currentIndex].id === song.id;
    const isPlaying = isThisActive && !audio.paused;

    return `
      <article class="track-card liquid-glass ${isThisActive ? 'is-active' : ''} ${isPlaying ? 'playing' : ''}" data-id="${song.id}">
        <div class="track-art" style="background:${song.color}">
          ${song.emoji}
        </div>
        <div class="track-details">
          <div class="track-title">${song.title}</div>
          <div class="track-artist">${song.artist}</div>
        </div>
        <div class="eq-bars">
          <span></span><span></span><span></span>
        </div>
        <div class="play-circle">
          ${isPlaying ? 'Ⅱ' : '▶'}
        </div>
      </article>
    `;
  }).join("");
}

async function playSong(id) {
  const index = songs.findIndex(song => song.id === id);
  if (index < 0) return;
  currentIndex = index;
  const song = songs[index];
  audio.pause();
  audio.src = song.url;
  audio.load();
  document.getElementById("nowTitle").textContent = song.title;
  document.getElementById("nowArtist").textContent = song.artist;
  document.getElementById("dockArt").textContent = song.emoji;
  document.getElementById("dockArt").style.background = song.color;
  currentTimeEl.textContent = "0:00";
  totalDurationEl.textContent = "0:00";
  timelineFill.style.width = "0%";
  timelineScrubber.style.left = "0%";
  updateLikeButton();
  renderTracks();
  try {
    await audio.play();
    setPlayIcon(true);
  } catch (error) {
    setPlayIcon(false);
    setPlaybackMessage(error.name === "NotAllowedError" ? "Tap play to start" : "Audio unavailable — add the MP3 file beside this page");
  }
}

function setPlayIcon(isPlaying) {
  playPauseIcon.innerHTML = isPlaying ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  renderTracks();
}

async function togglePlay() {
  if (currentIndex < 0) { await playSong(songs[0].id); return; }
  if (audio.paused) {
    try { await audio.play(); setPlaybackMessage(); setPlayIcon(true); }
    catch (_) { setPlaybackMessage("Audio unavailable — add the MP3 file beside this page"); setPlayIcon(false); }
  } else {
    audio.pause();
    setPlayIcon(false);
  }
}

function nextTrack() {
  if (!songs.length) return;
  if (currentIndex < 0) { playSong(songs[0].id); return; }
  if (isShuffle) {
    let rand = Math.floor(Math.random() * songs.length);
    if (rand === currentIndex) rand = (rand + 1) % songs.length;
    playSong(songs[rand].id);
  } else {
    playSong(songs[(currentIndex + 1) % songs.length].id);
  }
}

function prevTrack() {
  if (currentIndex < 0) { playSong(songs[0].id); return; }
  if (!audio.paused && audio.currentTime > 3) { audio.currentTime = 0; }
  else { playSong(songs[(currentIndex - 1 + songs.length) % songs.length].id); }
}

function handleTrackEnd() {
  if (loopMode === 2) {
    audio.currentTime = 0;
    audio.play().then(() => setPlayIcon(true)).catch(() => setPlayIcon(false));
  } else if (loopMode === 1 || currentIndex < songs.length - 1 || isShuffle) {
    nextTrack();
  } else {
    setPlayIcon(false);
  }
}

function updateLikeButton() {
  const song = songs[currentIndex];
  const isLiked = song && liked.includes(song.id);
  likeBtn.classList.toggle("active", isLiked);
  const icon = document.getElementById("likeIcon");
  if (isLiked) {
    icon.innerHTML = '<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>';
    likeBtn.style.color = "var(--red)";
  } else {
    icon.innerHTML = '<path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"/>';
    likeBtn.style.color = "#fff";
  }
}

loopBtn.addEventListener("click", () => {
  loopMode = (loopMode + 1) % 3;
  if (loopMode === 0) {
    loopBtn.classList.remove("active");
    loopIcon.innerHTML = '<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>';
  } else if (loopMode === 1) {
    loopBtn.classList.add("active");
    loopIcon.innerHTML = '<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>';
  } else {
    loopBtn.classList.add("active");
    loopIcon.innerHTML = '<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/><text x="10" y="15" fill="currentColor" font-size="8.5" font-weight="900">1</text>';
  }
});

shuffleBtn.addEventListener("click", () => {
  isShuffle = !isShuffle;
  shuffleBtn.classList.toggle("active", isShuffle);
});

volumeSlider.addEventListener("input", (e) => {
  const val = parseFloat(e.target.value);
  audio.volume = val;
  updateVolumeIcon();
});

function updateVolumeIcon() {
  const muted = audio.volume === 0;
  muteBtn.classList.toggle("active", muted);
  muteBtn.setAttribute("aria-label", muted ? "Unmute" : "Mute");
  volumeIcon.innerHTML = muted
    ? '<path d="M3 9v6h4l5 5V4L7 9H3zm13.59 3L20 8.59 18.59 7l-3 3-3-3L11 8.59 14.41 12 11 15.41 12.59 17l3-3 3 3L20 15.41 16.59 12z"/>'
    : '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
}
muteBtn.addEventListener("click", () => {
  if (audio.volume > 0) { previousVol = audio.volume; audio.volume = 0; }
  else { audio.volume = previousVol || 0.85; }
  volumeSlider.value = audio.volume;
  updateVolumeIcon();
});

function seek(e) {
  if (!Number.isFinite(audio.duration) || audio.duration <= 0) return;
  const rect = timelineSlot.getBoundingClientRect();
  const fraction = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  timelineFill.style.width = fraction * 100 + "%";
  timelineScrubber.style.left = fraction * 100 + "%";
  if (Number.isFinite(audio.duration)) audio.currentTime = fraction * audio.duration;
}

timelineSlot.addEventListener("pointerdown", (e) => { isDragging = true; timelineSlot.setPointerCapture(e.pointerId); seek(e); });
timelineSlot.addEventListener("pointermove", (e) => { if (isDragging) seek(e); });
timelineSlot.addEventListener("pointerup", () => { isDragging = false; });
timelineSlot.addEventListener("pointercancel", () => { isDragging = false; });
timelineSlot.addEventListener("keydown", (e) => {
  if (!Number.isFinite(audio.duration) || audio.duration <= 0) return;
  const step = e.shiftKey ? 10 : 5;
  if (e.key === "ArrowRight" || e.key === "ArrowUp") audio.currentTime = Math.min(audio.duration, audio.currentTime + step);
  else if (e.key === "ArrowLeft" || e.key === "ArrowDown") audio.currentTime = Math.max(0, audio.currentTime - step);
  else if (e.key === "Home") audio.currentTime = 0;
  else if (e.key === "End") audio.currentTime = audio.duration;
  else return;
  e.preventDefault();
});

audio.addEventListener("timeupdate", () => {
  if (isDragging || !Number.isFinite(audio.duration)) return;
  const percent = (audio.currentTime / audio.duration) * 100;
  timelineFill.style.width = percent + "%";
  timelineScrubber.style.left = percent + "%";
  timelineSlot.setAttribute("aria-valuenow", String(Math.round(percent)));
  timelineSlot.setAttribute("aria-valuetext", `${formatTime(audio.currentTime)} of ${formatTime(audio.duration)}`);
  currentTimeEl.textContent = formatTime(audio.currentTime);
});
audio.addEventListener("loadedmetadata", () => { totalDurationEl.textContent = formatTime(audio.duration); setPlaybackMessage(); });
audio.addEventListener("play", () => { setPlaybackMessage(); setPlayIcon(true); });
audio.addEventListener("pause", () => { if (!audio.ended) setPlayIcon(false); });
audio.addEventListener("ended", handleTrackEnd);
audio.addEventListener("error", () => {
  if (currentIndex >= 0) {
    setPlayIcon(false);
    setPlaybackMessage("Audio unavailable — add the MP3 file beside this page");
  }
});

playPauseBtn.addEventListener("click", togglePlay);
nextBtn.addEventListener("click", nextTrack);
prevBtn.addEventListener("click", prevTrack);

likeBtn.addEventListener("click", () => {
  if (currentIndex < 0) return;
  const id = songs[currentIndex].id;
  liked = liked.includes(id) ? liked.filter(item => item !== id) : [...liked, id];
  try { localStorage.setItem("dhh-liked", JSON.stringify(liked)); } catch (_) { /* Storage may be disabled. */ }
  updateLikeButton();
  renderTracks();
});

trackList.addEventListener("click", (e) => {
  const card = e.target.closest(".track-card");
  if (card) {
    const id = Number(card.dataset.id);
    if (currentIndex >= 0 && songs[currentIndex].id === id) togglePlay();
    else playSong(id);
  }
});

searchInput.addEventListener("input", renderTracks);
document.getElementById("heroSpotlight").addEventListener("click", () => playSong(songs[0].id));

limelightTabs.forEach(tab => {
  tab.addEventListener("click", () => {
    currentPage = tab.dataset.page;
    limelightTabs.forEach(t => t.classList.toggle("active", t === tab));
    updateLimelightPosition(tab);

    if (currentPage === "search") {
      searchInput.focus();
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else if (currentPage === "liked") {
      searchInput.value = "";
      renderTracks();
      document.querySelector(".section-header").scrollIntoView({ behavior: "smooth" });
    } else {
      currentPage = "home";
      renderTracks();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  });
});

window.addEventListener("resize", () => {
  const activeTab = document.querySelector(".limelight-tab.active");
  if (activeTab) updateLimelightPosition(activeTab);
});

audio.volume = Number(volumeSlider.value);
updateVolumeIcon();
renderTracks();
setTimeout(() => {
  const activeTab = document.querySelector(".limelight-tab.active");
  if (activeTab) updateLimelightPosition(activeTab);
}, 60);
</script>
</body>
</html>
