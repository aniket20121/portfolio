

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>DHH — 9 HIP HOP GANG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #080808;
    --card: #111111;
    --red: #ff1738;
    --white: #ffffff;
    --muted: #858585;
}
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
body {
    background: var(--bg);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
}
button, input {
    font: inherit;
}
button {
    cursor: pointer;
}
button:focus-visible,
input:focus-visible {
    outline: 2px solid var(--red);
    outline-offset: 4px;
}
.app {
    max-width: 480px;
    min-height: 100dvh;
    margin: auto;
    padding: 24px 19px 190px;
    overflow: hidden;
}
/* HEADER */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 35px;
}
.logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 35px;
    font-weight: 900;
    letter-spacing: -2px;
    transition: .3s ease;
    cursor: pointer;
}
.logo span {
    color: var(--red);
    text-shadow: 0 0 12px #ff173888;
}
.logo:hover {
    transform: scale(1.08);
    text-shadow: 0 0 22px #ff1738aa;
}
.status {
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 2px;
    color: var(--red);
    border: 1px solid #ff173855;
    border-radius: 20px;
    padding: 9px 12px;
    box-shadow: 0 0 12px #ff173811;
}
/* MAIN TITLE */
.kicker {
    color: var(--red);
    font-size: 10px;
    letter-spacing: 4px;
    font-weight: 800;
    margin-bottom: 12px;
}
h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(36px, 10vw, 48px);
    line-height: 1.13;
    letter-spacing: -2px;
    font-weight: 900;
    margin-bottom: 25px;
}
h1 span {
    color: var(--red);
    text-shadow: 0 0 25px #ff173844;
}
/* SEARCH */
.search {
    height: 53px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    background: #111;
    border: 1px solid #292929;
    border-radius: 13px;
    margin-bottom: 35px;
    transition: .25s ease;
}
.search:focus-within {
    border-color: var(--red);
    box-shadow: 0 0 18px #ff173833;
    transform: scale(1.015);
}
.search-icon {
    color: var(--red);
    font-size: 22px;
}
.search input {
    width: 100%;
    color: white;
    background: transparent;
    border: 0;
    outline: none;
    font-size: 13px;
}
.search input::placeholder {
    color: #707070;
}
/* SECTION */
.section-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}
.section-heading h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 16px;
    letter-spacing: -.5px;
}
.section-heading span {
    color: var(--red);
    font-size: 10px;
    letter-spacing: 2px;
    font-weight: 800;
}
/* FEATURE CARD */
.feature {
    min-height: 190px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 22px;
    margin-bottom: 33px;
    border: 1px solid #ff173844;
    border-radius: 18px;
    background:
        radial-gradient(ellipse at 85% 15%, #ff173844, transparent 40%),
        linear-gradient(135deg, #24090e, #100b0c 65%, #080808);
    transition: .3s ease;
}
.feature::before {
    content: "DHH";
    position: absolute;
    right: -14px;
    top: 12px;
    font-family: 'Orbitron', sans-serif;
    font-size: 78px;
    font-weight: 900;
    color: #ff17380c;
    transform: rotate(-12deg);
    pointer-events: none;
}
.feature:hover {
    transform: translateY(-5px) scale(1.01);
    border-color: var(--red);
    box-shadow: 0 0 28px #ff173833, inset 0 0 20px #ff17380a;
}
.feature-label {
    color: var(--red);
    font-size: 10px;
    letter-spacing: 3px;
    font-weight: 900;
    margin-bottom: 10px;
}
.feature h3 {
    position: relative;
    font-family: 'Orbitron', sans-serif;
    font-size: 24px;
    font-weight: 900;
    line-height: 1.3;
}
.feature p {
    color: #aaa;
    font-size: 12px;
    margin-top: 9px;
}
/* TRACK LIST */
.track-list {
    display: flex;
    flex-direction: column;
    gap: 11px;
}
.track {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 10px;
    background: var(--card);
    border: 1px solid #242424;
    border-radius: 14px;
    cursor: pointer;
    transition: transform .23s ease, border-color .23s ease,
                box-shadow .23s ease, background .23s ease;
}
.track:hover {
    transform: translateY(-3px) scale(1.015);
    background: #181012;
    border-color: var(--red);
    box-shadow: 0 0 20px #ff173822;
}
.track:active {
    transform: scale(.97);
}
.art {
    width: 58px;
    height: 58px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    font-size: 27px;
    border-radius: 10px;
    background: linear-gradient(135deg, #430913, #160b0d);
    border: 1px solid #ff173833;
    transition: .25s ease;
}
.track:hover .art {
    box-shadow: 0 0 16px #ff173855;
    border-color: var(--red);
    transform: rotate(-3deg) scale(1.04);
}
.track-info {
    flex: 1;
    min-width: 0;
}
.track-title {
    font-size: 13px;
    font-weight: 800;
    margin-bottom: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.track-artist {
    font-size: 11px;
    color: var(--muted);
}
.track-play {
    width: 35px;
    height: 35px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid #ff173855;
    background: #ff173810;
    color: var(--red);
    transition: .25s ease;
}
.track:hover .track-play,
.track-play:hover {
    background: var(--red);
    color: white;
    box-shadow: 0 0 18px #ff173866;
    transform: scale(1.12);
}
.empty {
    padding: 30px 0;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
}
/* MUSIC PLAYER */
.player {
    position: fixed;
    z-index: 10;
    left: 50%;
    bottom: calc(78px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    width: min(460px, calc(100% - 22px));
    padding: 14px;
    background: #151012ee;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid #ff173855;
    border-radius: 17px;
    box-shadow: 0 0 25px #ff17381a, 0 12px 45px #0009;
}
.player-top {
    display: flex;
    align-items: center;
    gap: 11px;
}
.mini-art {
    width: 43px;
    height: 43px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    background: #340b13;
    border: 1px solid #ff173855;
    border-radius: 10px;
    font-size: 22px;
}
.now-info {
    flex: 1;
    min-width: 0;
}
.now-title {
    font-size: 12px;
    font-weight: 800;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}
.now-artist {
    font-size: 10px;
    color: var(--muted);
    margin-top: 5px;
}
.player button {
    border: 0;
    background: transparent;
    color: white;
    transition: .2s ease;
}
.player button:hover {
    color: var(--red);
    transform: scale(1.15);
    text-shadow: 0 0 12px #ff1738aa;
}
#playPause {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--red);
    color: white;
    font-size: 16px;
    box-shadow: 0 0 14px #ff173844;
}
#playPause:hover {
    color: white;
    box-shadow: 0 0 25px #ff1738aa;
    transform: scale(1.12);
}
#likeBtn {
    color: var(--red);
    font-size: 21px;
}
.progress {
    height: 4px;
    margin-top: 13px;
    background: #393033;
    border-radius: 10px;
    cursor: pointer;
    overflow: hidden;
}
.progress-fill {
    width: 0;
    height: 100%;
    background: var(--red);
    box-shadow: 0 0 10px var(--red);
}
.time-row {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    color: #898080;
    font-size: 9px;
}
/* BOTTOM NAVIGATION */
.bottom-nav {
    position: fixed;
    z-index: 11;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: min(480px, 100%);
    height: calc(68px + env(safe-area-inset-bottom));
    padding: 8px 0 env(safe-area-inset-bottom);
    display: flex;
    justify-content: space-around;
    align-items: center;
    background: #0d0b0cf7;
    backdrop-filter: blur(20px);
    border-top: 1px solid #292020;
}
.nav-item {
    min-width: 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    border: 0;
    background: none;
    color: #777;
    font-size: 10px;
    transition: .25s ease;
}
.nav-icon {
    font-size: 21px;
    line-height: 1;
}
.nav-item:hover,
.nav-item.active {
    color: var(--red);
    transform: translateY(-3px);
    text-shadow: 0 0 14px #ff173866;
}
/* ACCESSIBILITY */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
    }
}
</style>
</head>
<body>
<main class="app">
    <header>
        <div class="logo">DHH<span>.</span></div>
        <div class="status">● HIP HOP</div>
    </header>
    <div class="kicker">WELCOME TO THE UNDERGROUND</div>
    <h1>9 HIP HOP<br><span>GANG.</span></h1>
    <label class="search">
        <span class="search-icon">⌕</span>
        <input id="searchInput" type="search"
               placeholder="Search tracks or artists..."
               aria-label="Search tracks or artists">
    </label>
    <section class="feature">
        <div class="feature-label">DHH EXCLUSIVE</div>
        <h3>THIS IS<br>HIP HOP.</h3>
        <p>Real sound. No boundaries. Just beats.</p>
    </section>
    <section>
        <div class="section-heading">
            <h2>9 HIP HOP GANG</h2>
            <span id="trackCount">06 TRACKS</span>
        </div>
        <div class="track-list" id="trackList"></div>
    </section>
</main>
<section class="player" aria-label="Music player">
    <div class="player-top">
        <div class="mini-art" id="miniArt">♫</div>
        <div class="now-info">
            <div class="now-title" id="nowTitle">DHH RADIO</div>
            <div class="now-artist" id="nowArtist">Choose a track to play</div>
        </div>
        <button id="likeBtn" aria-label="Like current track">♡</button>
        <button id="prevBtn" aria-label="Previous track">⏮</button>
        <button id="playPause" aria-label="Play or pause">▶</button>
        <button id="nextBtn" aria-label="Next track">⏭</button>
    </div>
    <div class="progress" id="progress" aria-label="Seek through track">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="time-row">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
    </div>
</section>
<nav class="bottom-nav">
    <button class="nav-item active" data-page="home">
        <span class="nav-icon">⌂</span>
        <span>Home</span>
    </button>
    <button class="nav-item" data-page="search">
        <span class="nav-icon">⌕</span>
        <span>Search</span>
    </button>
    <button class="nav-item" data-page="liked">
        <span class="nav-icon">♡</span>
        <span>Liked</span>
    </button>
    <button class="nav-item" data-page="library">
        <span class="nav-icon">▤</span>
        <span>Library</span>
    </button>
</nav>
<audio id="audio" preload="metadata"></audio>
<script>
const songs = [
    {
        id: 1,
        title: "Baaz",
        artist: "DHH Radio",
        emoji: "🌃",
        color: "#43121d",
        url: "baaz.mp3"
    },
    {
        id: 2,
        title: "Street Dreams",
        artist: "Underground Beats",
        emoji: "🎤",
        color: "#351018",
        url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
    },
    {
        id: 3,
        title: "Dark Streets",
        artist: "DHH Radio",
        emoji: "🌆",
        color: "#48101a",
        url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
    },
    {
        id: 4,
        title: "Red Zone",
        artist: "Underground Beats",
        emoji: "🔥",
        color: "#511019",
        url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"
    },
    {
        id: 5,
        title: "No Limits",
        artist: "DHH Radio",
        emoji: "⚡",
        color: "#371017",
        url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3"
    },
    {
        id: 6,
        title: "After Hours",
        artist: "Underground Beats",
        emoji: "🌙",
        color: "#27121a",
        url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3"
    }
];
const audio = document.getElementById("audio");
const trackList = document.getElementById("trackList");
const searchInput = document.getElementById("searchInput");
let currentIndex = -1;
let liked = JSON.parse(localStorage.getItem("dhh-liked") || "[]");
let currentPage = "home";
function timeFormat(value) {
    if (!Number.isFinite(value)) return "0:00";
    const minutes = Math.floor(value / 60);
    const seconds = Math.floor(value % 60).toString().padStart(2, "0");
    return `${minutes}:${seconds}`;
}
function renderTracks() {
    const query = searchInput.value.toLowerCase().trim();
    const filtered = songs.filter(song => {
        const matchesSearch =
            `${song.title} ${song.artist}`.toLowerCase().includes(query);
        const matchesLiked =
            currentPage !== "liked" || liked.includes(song.id);
        return matchesSearch && matchesLiked;
    });
    document.getElementById("trackCount").textContent =
        `${String(filtered.length).padStart(2, "0")} TRACKS`;
    if (!filtered.length) {
        trackList.innerHTML =
            '<div class="empty">No tracks found.</div>';
        return;
    }
    trackList.innerHTML = filtered.map(song => `
        <article class="track" data-id="${song.id}" tabindex="0"
                 role="button" aria-label="Play ${song.title}">
            <div class="art" style="background:${song.color}">
                ${song.emoji}
            </div>
            <div class="track-info">
                <div class="track-title">${song.title}</div>
                <div class="track-artist">${song.artist}</div>
            </div>
            <button class="track-play" aria-label="Play ${song.title}">
                ${currentIndex >= 0 &&
                  songs[currentIndex].id === song.id &&
                  !audio.paused ? "Ⅱ" : "▶"}
            </button>
        </article>
    `).join("");
}
function playSong(id) {
    const index = songs.findIndex(song => song.id === id);
    if (index < 0) return;
    currentIndex = index;
    const song = songs[index];
    audio.src = song.url;
    document.getElementById("nowTitle").textContent = song.title;
    document.getElementById("nowArtist").textContent = song.artist;
    document.getElementById("miniArt").textContent = song.emoji;
    document.getElementById("miniArt").style.background = song.color;
    updateLike();
    renderTracks();
    audio.play().then(updatePlayButton).catch(() => {
        document.getElementById("nowArtist").textContent =
            "Unable to play this track. Try another.";
        updatePlayButton();
    });
}
function updatePlayButton() {
    document.getElementById("playPause").textContent =
        audio.paused ? "▶" : "Ⅱ";
    renderTracks();
}
function updateLike() {
    const song = songs[currentIndex];
    document.getElementById("likeBtn").textContent =
        song && liked.includes(song.id) ? "♥" : "♡";
}
trackList.addEventListener("click", event => {
    const track = event.target.closest(".track");
    if (track) playSong(Number(track.dataset.id));
});
trackList.addEventListener("keydown", event => {
    if (event.target.classList.contains("track") &&
        (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        playSong(Number(event.target.dataset.id));
    }
});
document.getElementById("playPause").addEventListener("click", () => {
    if (currentIndex < 0) {
        playSong(songs[0].id);
    } else if (audio.paused) {
        audio.play().catch(() => {});
    } else {
        audio.pause();
    }
});
document.getElementById("nextBtn").addEventListener("click", () => {
    playSong(songs[(currentIndex + 1) % songs.length].id);
});
document.getElementById("prevBtn").addEventListener("click", () => {
    if (currentIndex < 0) {
        playSong(songs[0].id);
    } else if (audio.currentTime > 3) {
        audio.currentTime = 0;
    } else {
        playSong((songs[(currentIndex - 1 + songs.length) % songs.length]).id);
    }
});
document.getElementById("likeBtn").addEventListener("click", () => {
    if (currentIndex < 0) return;
    const id = songs[currentIndex].id;
    liked = liked.includes(id)
        ? liked.filter(item => item !== id)
        : [...liked, id];
    localStorage.setItem("dhh-liked", JSON.stringify(liked));
    updateLike();
    renderTracks();
});
searchInput.addEventListener("input", renderTracks);
audio.addEventListener("play", updatePlayButton);
audio.addEventListener("pause", updatePlayButton);
audio.addEventListener("timeupdate", () => {
    const percent = audio.duration
        ? audio.currentTime / audio.duration * 100
        : 0;
    document.getElementById("progressFill").style.width = percent + "%";
    document.getElementById("currentTime").textContent =
        timeFormat(audio.currentTime);
});
audio.addEventListener("loadedmetadata", () => {
    document.getElementById("duration").textContent =
        timeFormat(audio.duration);
});
audio.addEventListener("ended", () => {
    playSong(songs[(currentIndex + 1) % songs.length].id);
});
document.getElementById("progress").addEventListener("click", event => {
    if (!Number.isFinite(audio.duration)) return;
    const rect = event.currentTarget.getBoundingClientRect();
    const fraction = (event.clientX - rect.left) / rect.width;
    audio.currentTime = Math.max(0, Math.min(1, fraction)) * audio.duration;
});
document.querySelectorAll(".nav-item").forEach(button => {
    button.addEventListener("click", () => {
        currentPage = button.dataset.page;
        document.querySelectorAll(".nav-item").forEach(item => {
            item.classList.toggle("active", item === button);
        });
        if (currentPage === "search") {
            searchInput.focus();
            window.scrollTo({top: 0, behavior: "smooth"});
        } else if (currentPage === "liked") {
            renderTracks();
            document.querySelector(".section-heading")
                .scrollIntoView({behavior: "smooth"});
        } else {
            currentPage = "home";
            renderTracks();
            if (button.dataset.page === "library") {
                document.querySelector(".section-heading")
                    .scrollIntoView({behavior: "smooth"});
            } else {
                window.scrollTo({top: 0, behavior: "smooth"});
            }
        }
    });
});
renderTracks();
</script>
</body>
</html>
