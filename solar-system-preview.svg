<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
  <title id="title">Explore the Solar System</title>
  <desc id="desc">A glowing Sun surrounded by colorful planets on orbital paths against a starry sky.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11142c"/><stop offset=".52" stop-color="#090b18"/><stop offset="1" stop-color="#16102c"/></linearGradient>
    <radialGradient id="sun"><stop stop-color="#fff8c5"/><stop offset=".34" stop-color="#ffd35e"/><stop offset=".72" stop-color="#ff8b35"/><stop offset="1" stop-color="#f34a53"/></radialGradient>
    <radialGradient id="sunGlow"><stop stop-color="#ffbf59" stop-opacity=".46"/><stop offset="1" stop-color="#ff8050" stop-opacity="0"/></radialGradient>
    <linearGradient id="earth" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#63e2ff"/><stop offset=".5" stop-color="#2360d8"/><stop offset="1" stop-color="#0c1d4d"/></linearGradient>
    <linearGradient id="jupiter" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f6d4a2"/><stop offset=".24" stop-color="#bd7957"/><stop offset=".43" stop-color="#f0c99c"/><stop offset=".64" stop-color="#a95643"/><stop offset=".82" stop-color="#e4bd91"/><stop offset="1" stop-color="#755046"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
