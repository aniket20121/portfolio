<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar System</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;color:#fff}
  canvas{display:block;cursor:grab} canvas:active{cursor:grabbing}
  .glass{background:rgba(10,14,25,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);border-radius:12px}
  #ui{position:fixed;top:12px;left:12px;padding:10px 14px;font-size:13px;line-height:1.8;min-width:170px}
  #ui label{display:block;cursor:pointer;user-select:none}
  #ui input[type=range]{width:100%}
  #bar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:8px;max-width:96vw;overflow-x:auto}
  #bar button{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:6px 11px;font-size:12px;cursor:pointer;white-space:nowrap}
  #bar button:hover{background:rgba(255,255,255,.2)} #bar button.on{background:#3b82f6;border-color:#3b82f6}
  #info{position:fixed;top:12px;right:12px;width:250px;padding:14px 16px;font-size:13px;display:none}
  #info h2{margin:0 0 8px;font-size:20px} #info p{margin:8px 0 0;opacity:.8;line-height:1.45}
  #info div{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.07)}
  #info span{opacity:.6}
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .l{position:absolute;left:0;top:0;font-size:12px;text-shadow:0 0 4px #000,0 0 8px #000;white-space:nowrap;will-change:transform}
  .b{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer}
  .b:hover{background:rgba(255,255,255,.2)} .b.on{background:#3b82f6;border-color:#3b82f6}
  #sb{position:fixed;left:12px;bottom:74px;padding:10px 12px;width:190px;font-size:12px;line-height:1.7}
  #sbTools{display:none;margin-top:6px} #sbTools label{display:block} #sbTools input[type=range]{width:100%} #sb .row{display:flex;gap:4px;margin:4px 0}
  #cam{position:fixed;right:12px;bottom:74px;width:200px;display:none;padding:6px;font-size:11px;line-height:1.4}
  #cam video{width:200px;height:150px;object-fit:cover;transform:scaleX(-1);border-radius:8px;display:block;background:#000}
  #cam canvas{position:absolute;left:6px;top:6px}
  #hs{padding:4px 5px 1px;opacity:.9;min-height:16px}
  #hs:before{content:"";display:inline-block;width:7px;height:7px;margin:0 6px 1px 0;border-radius:50%;background:#94a3b8}
  #hs[data-state="tracking"]:before{background:#4ade80;box-shadow:0 0 8px #4ade80}
  #hs[data-state="lost"]:before{background:#fbbf24;box-shadow:0 0 8px #fbbf24}
  #handCursor{position:fixed;left:0;top:0;display:none;z-index:7;pointer-events:none;transform:translate(-50%,-50%);width:22px;height:22px;border:2px solid #7dd3fc;border-radius:50%;box-shadow:0 0 12px rgba(56,189,248,.7);color:#fff;text-align:center;font-size:17px;line-height:18px;text-shadow:0 0 5px #000}
  #handCursor.pinching{border-color:#4ade80;box-shadow:0 0 14px rgba(74,222,128,.9)}
  #toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);padding:8px 16px;border-radius:10px;background:rgba(0,0,0,.75);font-size:13px;opacity:0;transition:opacity .4s;pointer-events:none;z-index:6}
  #hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);padding:8px 16px;font-size:13px;display:none;white-space:nowrap;z-index:4}
  #touch{position:fixed;left:12px;right:12px;bottom:74px;justify-content:space-between;align-items:flex-end;display:none;pointer-events:none;z-index:5}
  #touch .tp{display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:auto} #touch .tp div{display:flex;gap:6px}
  #touch .tp.r{flex-direction:row;flex-wrap:wrap;width:124px;justify-content:flex-end}
  #touch button{min-width:54px;height:54px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(10,14,25,.6);color:#fff;font-size:13px;touch-action:none}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;transition:opacity .8s;z-index:9}
</style>
</head>

<div id="labels"></div>
<div id="ui" class="glass">

</div>

  <button class="b" id="sbToggle">⚛ Gravity sandbox</button>
  <div id="sbTools">
    <div class="row"><button class="b on" data-t="ast">Asteroid</button><button class="b" data-t="pla">Planet</button><button class="b" data-t="sta">Star</button></div>
    <label>Sun mass × <b id="sunv">1.00</b><input type="range" id="sunX" min=".3" max="3" step=".05" value="1"></label>
    <label>Jupiter mass × <b id="jupv">1</b><input type="range" id="jupX" min="1" max="300" step="1" value="1"></label>
    <label><input type="checkbox" id="addm" checked> Launch mode (off = move camera)</label>
    <button class="b" id="sbReset">Reset system</button><br>
    <small style="opacity:.6">Drag on the scene: direction + speed. Click = drop.</small>
  </div>
</div>

// ---------- Noise + procedural surfaces ----------
function hash(x,y,z){let h=x*374761393+y*668265263+z*1274126177;h=(h^(h>>13))*1274126177;return((h^(h>>16))>>>0)/4294967295}

 return l(l(l(hash(xi,yi,zi),hash(xi+1,yi,zi),u),l(hash(xi,yi+1,zi),hash(xi+1,yi+1,zi),u),v),l(l(hash(xi,yi,zi+1),hash(xi+1,yi,zi+1),u),l(hash(xi,yi+1,zi+1),hash(xi+1,yi+1,zi+1),u),v),w)}

    for(let i=0;i<W;i++){const lo=i/W*6.2832,px=Math.cos(la)*Math.cos(lo),py=Math.sin(la),pz=Math.cos(la)*Math.sin(lo),sc=o.sc||3;

function atmo(r,col){return new THREE.Mesh(new THREE.SphereGeometry(r*1.13,48,48),new THREE.ShaderMaterial({

{const N=9000,a=new Float32Array(N*3),cl=new Float32Array(N*3),sizes=new Float32Array(N),phases=new Float32Array(N);

 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),blending:THREE.AdditiveBlending,depthWrite:false}));s.scale.set(75,75,1);const s2=new THREE.Sprite(s.material.clone());s2.material.opacity=.3;s2.scale.set(170,170,1);sunMesh.add(s,s2)}

let earthClouds=null;

 const fin=new THREE.Mesh(new THREE.BoxGeometry(.03,.26,.24),blue);fin.position.set(0,.15,-.2);
 const glow=new THREE.Mesh(new THREE.ConeGeometry(.12,.7,16),new THREE.MeshBasicMaterial({color:0x7ec8ff,transparent:true,opacity:.85,blending:THREE.AdditiveBlending,depthWrite:false}));glow.rotation.x=-Math.PI/2;glow.position.z=-.6;
 ship.add(nose,body,wing,fin,glow);ship.userData.glow=glow;ship.scale.setScalar(1.2);ship.visible=false;scene.add(ship)}
function warpTo(b){const R=b.r*(b.d?psc:1);fly.landed=null;ship.position.copy(b.group.position).add(tmp.set(0,R*.5,R*3+8));
  fly.vel.copy(b.v||zero);ship.up.set(0,1,0);ship.lookAt(b.group.position);say('Warped to '+b.name)}
function startFly(){if(sb.on){say('Exit the gravity sandbox first');return}
  fly.on=true;focused=null;lineup=false;info.style.display='none';setOn(-1);ship.visible=true;warpTo(bodies.find(b=>b.name==='Earth'));
  $('flyBtn').classList.add('on');$('hud').style.display='block';$('sb').style.display='none';
  if(matchMedia('(pointer:coarse)').matches)$('touch').style.display='flex';
  say('W/S thrust • A/D turn • ↑↓ pitch • Q/E roll • Shift boost • Space brake • Esc exit • planet buttons = warp')}
function stopFly(){fly.on=false;ship.visible=false;for(const k in keys)keys[k]=false;camera.up.set(0,1,0);
  target.copy(ship.position);dist=camera.position.distanceTo(ship.position);
  $('flyBtn').classList.remove('on');$('hud').style.display='none';$('touch').style.display='none';$('sb').style.display='';overview()}
$('flyBtn').onclick=()=>fly.on?stopFly():startFly();
addEventListener('keydown',e=>{if(!fly.on)return;if(e.code==='Escape'){stopFly();return}keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.code]=false});
document.querySelectorAll('#touch [data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{keys[k]=true;e.preventDefault()});
  ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>keys[k]=false))});
function flyStep(dt){
  const k=c=>keys[c]?1:0,boost=(keys.ShiftLeft||keys.ShiftRight)?4:1;
  ship.rotateY(((k('KeyA')||k('ArrowLeft'))-(k('KeyD')||k('ArrowRight')))*1.6*dt);
  ship.rotateX(-(k('ArrowUp')-k('ArrowDown')+k('KeyR')-k('KeyF'))*1.4*dt);
  ship.rotateZ((k('KeyE')-k('KeyQ'))*1.8*dt);
  fwd.set(0,0,1).applyQuaternion(ship.quaternion);upv.set(0,1,0).applyQuaternion(ship.quaternion);
  const thr=k('KeyW')-k('KeyS')*.6;
  let near=null,nd=1e9;for(const b of bodies){const d=ship.position.distanceTo(b.group.position)-b.r*(b.d?psc:1);if(d<nd){nd=d;near=b}}
  if(fly.landed){const b=fly.landed;ship.position.copy(b.group.position).addScaledVector(fly.n,b.r*psc+.12);fly.vel.copy(b.v||zero);
    if(keys.KeyW){fly.landed=null;fly.vel.addScaledVector(fly.n,10);say('Lift off!')}}
  else{
    fly.vel.addScaledVector(fwd,thr*40*boost*dt);
    if(keys.Space){const ref=(near&&nd<Math.max(40,near.r*(near.d?psc:1)*6)&&near.v)?near.v:zero;tmp.copy(fly.vel).sub(ref);const sp=tmp.length();
      if(sp>1e-4)fly.vel.addScaledVector(tmp,-Math.min(sp,60*dt)/sp)}
    if(fly.vel.length()>300)fly.vel.setLength(300);
    ship.position.addScaledVector(fly.vel,dt);
    if(ship.position.length()>2500){ship.position.setLength(2500);fly.vel.set(0,0,0);say('Edge of the map — turning back')}
    if(near){const R=near.r*(near.d?psc:1)+.15,d=ship.position.distanceTo(near.group.position);
      if(d<R){tmp.copy(ship.position).sub(near.group.position).normalize();const sp=tmp2.copy(fly.vel).sub(near.v||zero).length();
        if(near.name==='Sun'){say('The ship melted in the Sun! Respawning at Earth…');warpTo(bodies.find(b=>b.name==='Earth'))}
        else if(sp<6){fly.landed=near;fly.n.copy(tmp);fly.vel.copy(near.v||zero);
          ship.quaternion.premultiply(new THREE.Quaternion().setFromUnitVectors(upv,tmp));say(`Landed on ${near.name}! Press W to take off`)}
        else{ship.position.copy(near.group.position).addScaledVector(tmp,R);fly.vel.copy(near.v||zero).addScaledVector(tmp,3);say('Too fast! Brake (Space) to under 6 u/s to land')}}}
  }
  ship.userData.glow.scale.set(1,.3+Math.max(0,thr)*boost*.7,1);
  fwd.set(0,0,1).applyQuaternion(ship.quaternion);upv.set(0,1,0).applyQuaternion(ship.quaternion);
  camera.position.copy(ship.position).addScaledVector(fwd,-5).addScaledVector(upv,1.6);camera.up.copy(upv);
  camera.lookAt(look.copy(ship.position).addScaledVector(fwd,12));
  if(!(hudN++%5)){const rel=tmp2.copy(fly.vel).sub(near&&near.v||zero).length();
    $('hud').textContent=fly.landed?`🛬 Landed on ${fly.landed.name} — press W to take off`:
      `🚀 ${fly.vel.length().toFixed(1)} u/s  •  ${near.name} ${Math.max(0,nd).toFixed(1)} u away  •  relative ${rel.toFixed(1)} u/s${nd<25&&rel>=6?'  ⚠ slow below 6 to land':''}`}
}

// ---------- Loop ----------
const clock=new THREE.Clock(),v=new THREE.Vector3(),sv=new THREE.Vector3(),goal=new THREE.Vector3();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05),s=$('pau').checked?0:+$('spd').value;
  if(starMaterial)starMaterial.uniforms.uTime.value+=dt;
  sunMesh.rotation.y+=dt*.05*s;
  psc=+$('siz').value;
  for(const b of bodies){if(!b.d)continue;b.group.scale.setScalar(psc);
    b.lw=Math.max(0,Math.min(1,b.lw+(lineup?1:-1)*dt*1.5));
    if(!sb.on){b.M+=dt*b.omega*s*(1-b.lw);kep(b.d,b.e,b.M,b.eul,tp);if(b.lw>0)tp.lerp(tl.set(b.d,0,0),b.lw*b.lw*(3-2*b.lw));b.group.position.copy(tp)}
    b.mesh.rotation.y+=dt*b.spin*s;if(b.name==='Earth'&&earthClouds)earthClouds.rotation.y+=dt*.04*s;
    for(const m of b.moons){m.ang+=dt*m.omega*s;m.m.position.set(Math.cos(m.ang)*m.d,0,Math.sin(m.ang)*m.d);m.m.rotation.y+=dt*.3*s}}
  if(sb.on&&s>0)runSB(dt*s);
  for(const b of bodies){if(!b.d)continue;if(!b.v){b.v=new THREE.Vector3();b.prev=b.group.position.clone()}if(dt>0)b.v.copy(b.group.position).sub(b.prev).divideScalar(dt);b.prev.copy(b.group.position)}
  belt.rotation.y+=dt*.01*s;belt.visible=$('ast').checked;
  scene.children.forEach(o=>{if(o.userData.orbit)o.visible=$('orb').checked&&!sb.on});
  if(fly.on)flyStep(dt);else{
  goal.copy(focused?focused.group.position:v.set(lineup?120:0,0,0));target.lerp(goal,.08);
  if(force>0){th+=(((gTh-th+Math.PI)%6.2832+6.2832)%6.2832-Math.PI)*.06;ph+=(gPh-ph)*.06;force-=.008}
  dist+=(tDist-dist)*.07;
  camera.position.set(target.x+dist*Math.sin(ph)*Math.sin(th),target.y+dist*Math.cos(ph),target.z+dist*Math.sin(ph)*Math.cos(th));
  camera.lookAt(target);
  }
  // names
  const show=$('lab').checked;
  for(const L of labels){let on=show;
    if(on){L.obj.getWorldPosition(v);L.obj.getWorldScale(sv);v.y+=L.r*sv.x*1.25;v.project(camera);on=v.z<1&&Math.abs(v.x)<1.1&&Math.abs(v.y)<1.1;
      if(on)L.el.style.transform=`translate(${(v.x*.5+.5)*innerWidth}px,${(-v.y*.5+.5)*innerHeight}px) translate(-50%,-100%)`}
    L.el.style.display=on?'block':'none'}
  (composer&&$('glow').checked)?composer.render():renderer.render(scene,camera)}
dist=900;overview();animate();
</script>
